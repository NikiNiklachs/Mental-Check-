# Veröffentlicht bei jedem Push den aktuellen Stand per EAS Update.
# Danach lässt er sich in Expo Go öffnen (mit demselben Expo-Konto angemeldet).
# Braucht das Repository-Secret EXPO_TOKEN (Anleitung in README.md).
name: App-Stand veröffentlichen

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Prüfen, ob EXPO_TOKEN eingetragen ist
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Das Secret EXPO_TOKEN fehlt. Anleitung: README.md, Abschnitt 'Ohne Computer testen'."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Verknüpft das Repo mit dem Expo-Projekt des Kontos (legt es beim ersten Mal an).
      - run: eas init --non-interactive --force

      - name: Update veröffentlichen
        env:
          BRANCH: ${{ github.ref_name }}
          MESSAGE: ${{ github.event.head_commit.message || 'Manuell gestartet' }}
        run: eas update --branch "$BRANCH" --message "$MESSAGE" --environment preview --non-interactive

      - name: Hinweis
        env:
          BRANCH: ${{ github.ref_name }}
        run: echo "Fertig. In Expo Go unter Projekte 'mental-check' öffnen, Branch '$BRANCH'." >> "$GITHUB_STEP_SUMMARY"
